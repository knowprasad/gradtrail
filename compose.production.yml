# Northstar with Docker Compose (see the Dossier installation guide, https://github.com/AienTech/dossier/wiki). Save this
# file as compose.yml in a folder of its own, put POSTGRES_PASSWORD,
# NORTHSTAR_PASSWORD (a hash of your password, from `docker run --rm -it
# ghcr.io/knowprasad/northstar-india hash-password`) and NORTHSTAR_SECRET in a .env file
# next to it, then:
#
#   docker compose up -d
#
# Add COMPOSE_PROFILES=ai to .env to run Ollama for a local model as well.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: northstar
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${NORTHSTAR_IMAGE:-ghcr.io/knowprasad/northstar-india:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://northstar:${POSTGRES_PASSWORD}@db:5432/northstar
      NORTHSTAR_PASSWORD: ${NORTHSTAR_PASSWORD:?Set NORTHSTAR_PASSWORD in .env to a hash from hash-password}
      NORTHSTAR_SECRET: ${NORTHSTAR_SECRET:?Set NORTHSTAR_SECRET in .env}
      NORTHSTAR_BACKUP_RETENTION_DAYS: ${NORTHSTAR_BACKUP_RETENTION_DAYS:-}
      # Your time zone, e.g. Europe/Berlin: nightly backups run at 03:00 in it.
      TZ: ${TZ:-UTC}
      NORTHSTAR_AI_PROVIDER: ${NORTHSTAR_AI_PROVIDER:-}
      NORTHSTAR_AI_URL: ${NORTHSTAR_AI_URL:-}
      NORTHSTAR_AI_MODEL: ${NORTHSTAR_AI_MODEL:-}
      NORTHSTAR_AI_KEY: ${NORTHSTAR_AI_KEY:-}
      NORTHSTAR_AI_TIMEOUT_SECONDS: ${NORTHSTAR_AI_TIMEOUT_SECONDS:-}
      # The daily usage ping: unset, northstar asks after sign-in; on or off answers in advance (see Privacy in the wiki).
      NORTHSTAR_TELEMETRY: ${NORTHSTAR_TELEMETRY:-}
      # Defaults for Settings → Job search.
      NORTHSTAR_JOBS_SOURCE: ${NORTHSTAR_JOBS_SOURCE:-}
      NORTHSTAR_JSEARCH_KEY: ${NORTHSTAR_JSEARCH_KEY:-}
      NORTHSTAR_JSEARCH_HOST: ${NORTHSTAR_JSEARCH_HOST:-}
      NORTHSTAR_ADZUNA_APP_ID: ${NORTHSTAR_ADZUNA_APP_ID:-}
      NORTHSTAR_ADZUNA_KEY: ${NORTHSTAR_ADZUNA_KEY:-}
      NORTHSTAR_FREEHIRE_URL: ${NORTHSTAR_FREEHIRE_URL:-}
      NORTHSTAR_JOBS_ARBEITSAGENTUR: ${NORTHSTAR_JOBS_ARBEITSAGENTUR:-}
      # Gmail and Calendar: a Google OAuth client (or enter it in Settings → Google).
      NORTHSTAR_GOOGLE_CLIENT_ID: ${NORTHSTAR_GOOGLE_CLIENT_ID:-}
      NORTHSTAR_GOOGLE_CLIENT_SECRET: ${NORTHSTAR_GOOGLE_CLIENT_SECRET:-}
      # The address northstar is reached at, for Google's redirect.
      NORTHSTAR_PUBLIC_URL: ${NORTHSTAR_PUBLIC_URL:-}
    # Only on the server itself: put a reverse proxy with HTTPS in front.
    ports:
      - "127.0.0.1:${NORTHSTAR_PORT:-3000}:3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g
    # Lets http://host.docker.internal reach Ollama (:11434) or LM Studio
    # (:1234) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A local model, with COMPOSE_PROFILES=ai in .env: `docker compose up -d`,
  # then pull one (see "Choosing an AI provider" in the wiki). northstar reaches it at http://ollama:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  data:
  ollama:
