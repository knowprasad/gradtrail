# GradTrail with Docker Compose (see the Dossier installation guide, https://github.com/AienTech/dossier/wiki). Save this
# file as compose.yml in a folder of its own, put POSTGRES_PASSWORD,
# GRADTRAIL_PASSWORD (a hash of your password, from `docker run --rm -it
# ghcr.io/knowprasad/gradtrail hash-password`) and GRADTRAIL_SECRET in a .env file
# next to it, then:
#
#   docker compose up -d
#
# Add COMPOSE_PROFILES=ai to .env to run Ollama for a local model as well.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: northstar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: northstar
    volumes:
      # Postgres 18+ keeps data in a versioned subdirectory, so mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northstar -d northstar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${GRADTRAIL_IMAGE:-ghcr.io/knowprasad/gradtrail:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://northstar:${POSTGRES_PASSWORD}@db:5432/northstar
      GRADTRAIL_PASSWORD: ${GRADTRAIL_PASSWORD:?Set GRADTRAIL_PASSWORD in .env to a hash from hash-password}
      GRADTRAIL_SECRET: ${GRADTRAIL_SECRET:?Set GRADTRAIL_SECRET in .env}
      GRADTRAIL_BACKUP_RETENTION_DAYS: ${GRADTRAIL_BACKUP_RETENTION_DAYS:-}
      # Your time zone, e.g. Europe/Berlin: nightly backups run at 03:00 in it.
      TZ: ${TZ:-UTC}
      GRADTRAIL_AI_PROVIDER: ${GRADTRAIL_AI_PROVIDER:-}
      GRADTRAIL_AI_URL: ${GRADTRAIL_AI_URL:-}
      GRADTRAIL_AI_MODEL: ${GRADTRAIL_AI_MODEL:-}
      GRADTRAIL_AI_KEY: ${GRADTRAIL_AI_KEY:-}
      GRADTRAIL_AI_TIMEOUT_SECONDS: ${GRADTRAIL_AI_TIMEOUT_SECONDS:-}
      # The daily usage ping: unset, GradTrail asks after sign-in; on or off answers in advance (see Privacy in the wiki).
      GRADTRAIL_TELEMETRY: ${GRADTRAIL_TELEMETRY:-}
      # Defaults for Settings → Job search.
      GRADTRAIL_JOBS_SOURCE: ${GRADTRAIL_JOBS_SOURCE:-}
      GRADTRAIL_JSEARCH_KEY: ${GRADTRAIL_JSEARCH_KEY:-}
      GRADTRAIL_JSEARCH_HOST: ${GRADTRAIL_JSEARCH_HOST:-}
      GRADTRAIL_ADZUNA_APP_ID: ${GRADTRAIL_ADZUNA_APP_ID:-}
      GRADTRAIL_ADZUNA_KEY: ${GRADTRAIL_ADZUNA_KEY:-}
      GRADTRAIL_FREEHIRE_URL: ${GRADTRAIL_FREEHIRE_URL:-}
      GRADTRAIL_JOBS_ARBEITSAGENTUR: ${GRADTRAIL_JOBS_ARBEITSAGENTUR:-}
      # Gmail and Calendar: a Google OAuth client (or enter it in Settings → Google).
      GRADTRAIL_GOOGLE_CLIENT_ID: ${GRADTRAIL_GOOGLE_CLIENT_ID:-}
      GRADTRAIL_GOOGLE_CLIENT_SECRET: ${GRADTRAIL_GOOGLE_CLIENT_SECRET:-}
      # The address GradTrail is reached at, for Google's redirect.
      GRADTRAIL_PUBLIC_URL: ${GRADTRAIL_PUBLIC_URL:-}
    # Only on the server itself: put a reverse proxy with HTTPS in front.
    ports:
      - "127.0.0.1:${GRADTRAIL_PORT:-3000}:3000"
    volumes:
      - data:/data
    # Room for Chromium, which prints the PDFs.
    mem_limit: 1g
    # Lets http://host.docker.internal reach Ollama (:11434) or LM Studio
    # (:1234) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # A local model, with COMPOSE_PROFILES=ai in .env: `docker compose up -d`,
  # then pull one (see "Choosing an AI provider" in the wiki). GradTrail reaches it at http://ollama:11434.
  ollama:
    profiles: [ai]
    image: ollama/ollama:0.40.10
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  data:
  ollama:
